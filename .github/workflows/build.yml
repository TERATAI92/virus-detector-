name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zip unzip libltdl-dev cmake \
            autoconf automake libtool pkg-config \
            libncurses5 libtinfo5

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0 cython==0.29.36

      - name: Prepare stable python-for-android 2024.1.21
        run: |
          python -m pip download python-for-android==2024.1.21 \
            --no-binary :all: --no-deps -d /tmp/p4a
          sudo mkdir -p /opt/p4a-stable
          sudo tar -xzf /tmp/p4a/python-for-android-2024.1.21.tar.gz \
            -C /opt/p4a-stable --strip-components=1
          sudo chown -R runner:runner /opt/p4a-stable
          ls /opt/p4a-stable

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: List hasil build
        if: always()
        run: |
          echo "=== root ==="; ls -la
          echo "=== bin ==="; ls -la bin || true
          echo "=== semua apk ==="; find .buildozer -name "*.apk" 2>/dev/null || true

      - name: Show error tail
        if: failure()
        run: |
          echo "=========== 60 BARIS TERAKHIR ==========="
          tail -n 60 build.log
          echo "=========== BARIS ERROR ==========="
          grep -i -n "error" build.log | tail -n 30

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: virusdetector-apk
          path: |
            bin/*.apk
            .buildozer/android/platform/build-*/dists/*/bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
