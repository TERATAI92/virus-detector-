name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zip unzip libltdl-dev cmake \
            autoconf automake libtool pkg-config

      - name: Install Buildozer
        run: python -m pip install --upgrade pip buildozer cython

      - name: Pin python-for-android ke rilis stabil
        run: |
          mkdir -p .buildozer/android/platform
          git clone --branch 2024.1.21 --depth 1 \
            https://github.com/kivy/python-for-android \
            .buildozer/android/platform/python-for-android

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virusdetector-apk
          path: bin/*.apk
          retention-days: 14
